[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "packetbreaker"
version = "0.1.5"
description = "Local, evidence-first multi-hop packet capture correlation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.2,<2", "psutil>=7,<8", "tzdata>=2025.2", "fastapi>=0.143,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1"]

[project.optional-dependencies]
benchmark = ["dpkt==1.9.8"]
test = ["pytest>=8,<10", "httpx2>=2.13,<3", "starlette>=1.7,<2", "build>=1.2,<2", "ruff>=0.11,<1"]

[project.scripts]
packetbreaker = "packetbreaker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
packetbreaker = ["static/**/*", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: exhaustive real-tshark matrices and large repeated-analysis fixtures; run explicitly with -m slow"]
filterwarnings = ["error::starlette.exceptions.StarletteDeprecationWarning"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
