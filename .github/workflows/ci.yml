name: PacketBreaker acceptance
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: acceptance-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(github.event_name == 'push' && '{"os":["macos-14"],"python":["3.12"]}' || '{"os":["macos-14","macos-15-intel","windows-latest"],"python":["3.11","3.12"]}') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install tshark on macOS
        if: runner.os == 'macOS'
        run: brew install wireshark
      - name: Install and verify tshark on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install wireshark --yes --no-progress
          $tsharkPath = 'C:\Program Files\Wireshark\tshark.exe'
          if (!(Test-Path $tsharkPath)) { throw "tshark missing at $tsharkPath" }
          & $tsharkPath --version
          if ($LASTEXITCODE -ne 0) { throw 'tshark failed to start' }
      - name: Build bundled UI
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - run: python -m pip install -e ".[test]"
      - name: Verify Python tshark auto-detection
        run: python -c "from packetbreaker.ingest import find_tshark; import subprocess; p=find_tshark(); print(p); subprocess.run([p,'--version'],check=True)"
      - run: ruff check src tests tools
      - name: Fast portability suite
        run: pytest -m "not slow" -q
      - name: Slow real-tshark acceptance matrix
        if: github.event_name != 'push' && matrix.os == 'macos-14' && matrix.python == '3.12'
        run: pytest -m slow -q
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: packetbreaker-${{ matrix.os }}-${{ matrix.python }}
          path: dist/*
