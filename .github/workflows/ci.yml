name: PacketBreaker acceptance
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: acceptance-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(github.event_name == 'push' && '{"os":["macos-14"],"python":["3.12"]}' || '{"os":["macos-14","macos-15-intel","windows-latest"],"python":["3.11","3.12"]}') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install tshark on macOS
        if: runner.os == 'macOS'
        run: brew install wireshark
      - name: Install and verify tshark on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install wireshark --yes --no-progress
          $tsharkPath = 'C:\Program Files\Wireshark\tshark.exe'
          if (!(Test-Path $tsharkPath)) { throw "tshark missing at $tsharkPath" }
          & $tsharkPath --version
          if ($LASTEXITCODE -ne 0) { throw 'tshark failed to start' }
      - name: Build bundled UI
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - run: python -m pip install -e ".[test]"
      - name: Verify Python tshark auto-detection
        run: python -c "from packetbreaker.ingest import find_tshark; import subprocess; p=find_tshark(); print(p); subprocess.run([p,'--version'],check=True)"
      - run: ruff check src tests tools
      - name: Fast portability suite
        if: runner.os != 'Windows'
        run: python tools/windows_fast_suite.py --workers 4
      - name: Fast Windows portability suite (all tests, resource-bounded isolated processes)
        if: runner.os == 'Windows'
        run: python tools/windows_fast_suite.py
      - name: Hosted Windows fast-suite budget (advisory; hosted runner timing is noisy)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: python -c "import json; r=json.load(open('fast-suite-summary.json')); seconds=r['wall_seconds']; print(f'Fast suite wall {seconds:.2f}s / 240s'); assert seconds < 240, 'Windows fast suite exceeds four minutes'"
      - name: Slow real-tshark acceptance matrix
        if: github.event_name != 'push' && matrix.os == 'macos-14' && matrix.python == '3.12'
        run: pytest -m slow -q
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: packetbreaker-${{ matrix.os }}-${{ matrix.python }}
          path: dist/*
  packaging:
    # Native packaging is a PR/manual gate; pushes keep the single acceptance job.
    if: github.event_name != 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: macos-arm64
          - os: macos-15-intel
            arch: macos-x86_64
          - os: windows-latest
            arch: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install tshark on macOS
        if: runner.os == 'macOS'
        run: brew install wireshark
      - name: Install and verify tshark on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install wireshark --yes --no-progress
          $tsharkPath = 'C:\Program Files\Wireshark\tshark.exe'
          if (!(Test-Path $tsharkPath)) { throw "tshark missing at $tsharkPath" }
          & $tsharkPath --version
          if ($LASTEXITCODE -ne 0) { throw 'tshark failed to start' }
      - name: Build bundled UI
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - run: python -m pip install ".[packaging]"
      - run: python tools/build_binary.py
      - name: Smoke native macOS executable
        if: runner.os == 'macOS'
        run: python tools/smoke_binary.py dist/binary/packetbreaker
      - name: Smoke native Windows executable
        if: runner.os == 'Windows'
        run: python tools/smoke_binary.py dist/binary/packetbreaker.exe
      - name: Archive macOS executable (preserve executable permissions)
        if: runner.os == 'macOS'
        run: tar -czf dist/packetbreaker-${{ matrix.arch }}.tar.gz -C dist/binary packetbreaker
      - name: Archive Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive dist/binary/packetbreaker.exe dist/packetbreaker-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: packetbreaker-native-${{ matrix.arch }}
          path: |
            dist/packetbreaker-*.tar.gz
            dist/packetbreaker-*.zip
          if-no-files-found: error
